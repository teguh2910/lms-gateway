services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
      POSTGRES_DB: lms_class
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - lms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - lms-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  lms-class-services:
    build: ./lms-class-services
    ports:
      - "8001:8000"
    env_file:
      - ./lms-class-services/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms-network
    restart: unless-stopped

  lms-conference-services:
    build: ./lms-conference-services
    ports:
      - "8002:8000"
    env_file:
      - ./lms-conference-services/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms-network
    restart: unless-stopped

  lms-material-services:
    build: ./lms-material-services
    ports:
      - "8003:8000"
    env_file:
      - ./lms-material-services/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lms-post-services:
        condition: service_started
    networks:
      - lms-network
    restart: unless-stopped

  lms-quiz-services:
    build: ./lms-quiz-services
    ports:
      - "8004:8000"
    env_file:
      - ./lms-quiz-services/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lms-post-services:
        condition: service_started
    networks:
      - lms-network
    restart: unless-stopped

  lms-task-services:
    build: ./lms-task-services
    ports:
      - "8005:8000"
    env_file:
      - ./lms-task-services/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lms-post-services:
        condition: service_started
    networks:
      - lms-network
    restart: unless-stopped

  lms-post-services:
    build: ./lms-post-services
    ports:
      - "8006:8000"
    env_file:
      - ./lms-post-services/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms-network
    restart: unless-stopped

  lms-storage-service:
    build: ./lms-storage-service
    ports:
      - "8007:8000"
    env_file:
      - ./lms-storage-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms-network
    restart: unless-stopped

  user-services:
    build: ./user-services
    ports:
      - "8008:8000"
    env_file:
      - ./user-services/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms-network
    restart: unless-stopped

  lms-gateway:
    build: ./lms-gateway
    ports:
      - "8080:8080"
    env_file:
      - ./lms-gateway/.env
    depends_on:
      - lms-class-services
      - lms-conference-services
      - lms-material-services
      - lms-quiz-services
      - lms-task-services
      - lms-post-services
      - lms-storage-service
      - user-services
    networks:
      - lms-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  lms-network:
    driver: bridge
