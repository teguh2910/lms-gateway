syntax = "proto3";
package storages;

option go_package = "lms-gateway/pb/storage/storages;storages";

message Storage {
    string id = 1;
    string file_name = 2;
    string file_type = 3;
    int64 file_size = 4;
    string bucket = 5;
    string path = 6;
    string url = 7;
    bool is_used = 8;
    string updated_by = 9;
    string updated_at = 10;
    string created_at = 11;
}

message UploadRequest {
    string file_name = 1;
    string file_type = 2;
    bytes chunk_data = 3;
}

message UploadResponse {
    string id = 1;
    string file_name = 2;
    string url = 3;
}

message GetFileRequest {
    string id = 1;
}

message GetFileResponse {
    string id = 1;
    string file_name = 2;
    string signed_url = 3;
    string file_type = 4;
    int64 file_size = 5;
}

message DeleteRequest {
    string id = 1;
}

message DeleteResponse {
    bool success = 1;
}
