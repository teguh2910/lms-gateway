syntax = "proto3";
package users;

option go_package = "lms-gateway/pb/user/users;users";

import "user/generic/generic_message.proto";

message User {
    string id = 1;
    string email = 2;
    string name = 3;
    string role = 4;
    string university_id = 5;
    string university_name = 6;
    string program_studi_id = 7;
    string program_studi_name = 8;
    bool is_active = 9;
    string updated_by = 10;
    string updated_at = 11;
    string created_at = 12;
}

message UserList {
    repeated User users = 1;
    uint32 count = 2;
}

message UserListInput {
    lms_user_services.Pagination pagination = 1;
    string role = 2;
}

message RegisterInput {
    string email = 1;
    string password = 2;
    string name = 3;
    string role = 4;
    string university_id = 5;
    string university_name = 6;
    string program_studi_id = 7;
    string program_studi_name = 8;
}

message LoginInput {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1;
    User user = 2;
    string expires_at = 3;
}

message UpdateUserInput {
    string id = 1;
    string name = 2;
    string role = 3;
    string university_id = 4;
    string university_name = 5;
    string program_studi_id = 6;
    string program_studi_name = 7;
    bool is_active = 8;
}

message ChangePasswordInput {
    string id = 1;
    string old_password = 2;
    string new_password = 3;
}

message ValidateTokenInput {
    string token = 1;
}

message ValidateTokenResponse {
    bool valid = 1;
    User user = 2;
}

service UserService {
    rpc Register(RegisterInput) returns (User);
    rpc Login(LoginInput) returns (LoginResponse);
    rpc ValidateToken(ValidateTokenInput) returns (ValidateTokenResponse);
    rpc List(UserListInput) returns (UserList);
    rpc Get(lms_user_services.Id) returns (User);
    rpc Update(UpdateUserInput) returns (User);
    rpc ChangePassword(ChangePasswordInput) returns (lms_user_services.BoolMessage);
    rpc Delete(lms_user_services.Id) returns (lms_user_services.BoolMessage);
}
