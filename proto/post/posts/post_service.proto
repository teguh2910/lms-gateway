syntax = "proto3";
package posts;

option go_package = "lms-gateway/pb/post/posts;posts";

import "post/posts/generic_message.proto";
import "post/posts/post_input.proto";
import "post/posts/post_message.proto";

service Posts {
     rpc CreatePost(CreatePostRequest) returns (Post) {}
     rpc UpdatePost(UpdatePostRequest) returns (Post) {}
     rpc GetPost(Id) returns (Post) {}
     rpc UnpublishPost(Id) returns (BoolMessage) {}
     rpc CreateComment(CreateCommentRequest) returns (Comment) {}
}
